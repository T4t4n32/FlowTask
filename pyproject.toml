[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtask"
version = "0.1.0"
description = "Sistema inteligente de gestión de tareas vía Telegram"
authors = [{ name = "T4t4n32", email = "ssch200913@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "sqlalchemy",
    "jinja2",
    "python-dotenv",
    "alembic",
    "psycopg[binary]",
    "dateparser",
    "apscheduler",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint] # Agrega esta línea
select = ["E", "F", "W", "I", "B", "UP", "N"]