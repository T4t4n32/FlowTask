<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FlowTask OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .card-glass { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 32px; backdrop-filter: blur(12px); }
        .mango-card { background: linear-gradient(135deg, #FFD93D 0%, #FF8400 100%); color: #000; }
        /* Ocultar input fecha pero mantenerlo funcional sobre el numero */
        .date-overlay { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; top: 0; left: 0; }
        .progress-bar { transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6 pb-32">

    <div id="stats-store" data-hd="{{ stats.h_done }}" data-ht="{{ stats.h_total }}" data-td="{{ stats.t_done }}" data-tt="{{ stats.t_total }}" data-day="{{ current_date }}" style="display:none"></div>

    <div class="max-w-lg mx-auto">
        <header class="mt-12 mb-10 flex justify-between items-center">
            <a href="/dashboard?day={{ prev_day }}" class="text-zinc-700 text-2xl font-black p-4">←</a>
            
            <div class="text-center relative">
                <p class="text-[10px] font-black text-zinc-600 tracking-[0.3em] mb-1">{{ nombre_dia }}</p>
                <div class="relative inline-block">
                    <h1 class="text-9xl font-extrabold tracking-tighter">{{ dia_num }}</h1>
                    <input type="date" class="date-overlay" onchange="window.location.href='/dashboard?day='+this.value">
                </div>
                <p class="text-orange-500 font-black text-sm tracking-widest mt-1">{{ mes_txt }} <span class="text-zinc-800">{{ año }}</span></p>
            </div>

            <a href="/dashboard?day={{ next_day }}" class="text-zinc-700 text-2xl font-black p-4 {% if is_today %}opacity-0 pointer-events-none{% endif %}">→</a>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-12">
            <div class="card-glass p-6" onclick="abrirHistorial('habits')">
                <div class="flex justify-between mb-2 uppercase text-[9px] font-black tracking-widest">
                    <span class="text-zinc-500">Hábitos</span>
                    <span id="h-pct" class="text-orange-500">0%</span>
                </div>
                <div class="h-1.5 bg-zinc-900 rounded-full overflow-hidden">
                    <div id="h-bar" class="progress-bar h-full bg-orange-500"></div>
                </div>
            </div>
            <div class="card-glass p-6" onclick="abrirHistorial('tasks')">
                <div class="flex justify-between mb-2 uppercase text-[9px] font-black tracking-widest">
                    <span class="text-zinc-500">Tareas</span>
                    <span id="t-pct" class="text-blue-500">0%</span>
                </div>
                <div class="h-1.5 bg-zinc-900 rounded-full overflow-hidden">
                    <div id="t-bar" class="progress-bar h-full bg-blue-500"></div>
                </div>
            </div>
        </div>

        <div id="main-content">
            {% if mango %}
            <div class="mb-12">
                <h3 class="text-[10px] font-black text-zinc-800 uppercase tracking-widest mb-4 ml-2">Foco Mango</h3>
                {% for m in mango %}
                <div class="mango-card p-6 rounded-[2.5rem] mb-4 flex justify-between items-center shadow-2xl">
                    <span class="font-extrabold text-xl tracking-tight">{{ m.title }}</span>
                    <div class="flex gap-2">
                        <button onclick="eliminar('{{m.id}}')" class="w-10 h-10 bg-black/5 rounded-xl flex items-center justify-center font-bold">×</button>
                        <button onclick="completar('{{m.id}}')" class="w-10 h-10 bg-black/10 rounded-xl flex items-center justify-center font-bold">✓</button>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="space-y-10">
                <section>
                    <h3 class="text-[10px] font-black text-zinc-900 uppercase tracking-widest mb-4 ml-2">Rutinas Diarias</h3>
                    {% for h in habits %}
                    <div class="card-glass p-6 mb-3 flex justify-between items-center">
                        <span class="font-bold text-zinc-300">{{ h.title }}</span>
                        <div class="flex items-center gap-4">
                            <button onclick="eliminar('{{h.id}}')" class="text-zinc-800 font-bold">×</button>
                            <button onclick="completar('{{h.id}}')" class="w-8 h-8 rounded-full border-2 border-orange-500/30 flex items-center justify-center">
                                <div class="w-2.5 h-2.5 bg-orange-500 rounded-full"></div>
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </section>

                <section>
                    <h3 class="text-[10px] font-black text-zinc-900 uppercase tracking-widest mb-4 ml-2">Inbox</h3>
                    {% for t in tasks %}
                    <div class="card-glass p-6 mb-3 flex justify-between items-center">
                        <div class="flex items-center">
                            <input type="checkbox" onchange="completar('{{t.id}}')" class="w-6 h-6 mr-4 accent-blue-600 rounded-lg bg-transparent border-zinc-800">
                            <span class="font-bold text-zinc-500">{{ t.title }}</span>
                        </div>
                        <button onclick="eliminar('{{t.id}}')" class="text-zinc-800 font-bold">×</button>
                    </div>
                    {% endfor %}
                </section>
            </div>
        </div>
    </div>

    <div id="modal-historial" class="modal" onclick="cerrarModal()">
        <div class="card-glass w-full max-w-sm p-8" onclick="event.stopPropagation()">
            <h4 id="modal-titulo" class="text-3xl font-black mb-8 tracking-tighter"></h4>
            <div id="modal-lista" class="space-y-4 max-h-80 overflow-y-auto pr-2"></div>
            <button onclick="cerrarModal()" class="w-full mt-8 py-5 bg-zinc-900 rounded-3xl font-black text-[10px] tracking-widest">CERRAR</button>
        </div>
    </div>

    <script>
        function updateProgress() {
            const d = document.getElementById('stats-store').dataset;
            const hPct = d.ht > 0 ? Math.round((d.hd/d.ht)*100) : 0;
            const tPct = d.tt > 0 ? Math.round((d.td/d.tt)*100) : 0;
            document.getElementById('h-bar').style.width = hPct + '%';
            document.getElementById('h-pct').innerText = hPct + '%';
            document.getElementById('t-bar').style.width = tPct + '%';
            document.getElementById('t-pct').innerText = tPct + '%';
        }

        async function completar(id) {
            await fetch('/complete/' + id, { method: 'POST' });
            location.reload();
        }

        async function eliminar(id) {
            if(confirm('¿Eliminar para siempre?')) {
                await fetch('/delete/' + id, { method: 'DELETE' });
                location.reload();
            }
        }

        async function abrirHistorial(tipo) {
            const day = document.getElementById('stats-store').dataset.day;
            document.getElementById('modal-titulo').innerText = tipo === 'habits' ? 'Logros' : 'Completadas';
            document.getElementById('modal-historial').style.display = 'flex';
            
            const res = await fetch(`/api/history/${tipo}?day=${day}`);
            const data = await res.json();
            
            document.getElementById('modal-lista').innerHTML = data.map(i => `
                <div class="flex justify-between items-center p-5 bg-white/5 rounded-[2rem]">
                    <div>
                        <p class="text-sm font-bold text-zinc-200">${i.title}</p>
                        <p class="text-[9px] font-black text-zinc-700 uppercase">${i.time}</p>
                    </div>
                    <button onclick="eliminar('${i.id}')" class="text-red-900/40 text-xl px-2">×</button>
                </div>
            `).join('') || '<p class="text-center text-zinc-700 py-10">Nada por aquí aún.</p>';
        }

        function cerrarModal() { document.getElementById('modal-historial').style.display = 'none'; }

        window.onload = updateProgress;
    </script>
</body>
</html>
