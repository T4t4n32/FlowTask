<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FlowTask</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FlowTask">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" href="/static/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .card-glass { background: rgba(18, 18, 18, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 28px; backdrop-filter: blur(12px); }
        .mango-card { background: linear-gradient(135deg, #FFD93D 0%, #FF8400 100%); color: #000; box-shadow: 0 10px 40px rgba(255, 132, 0, 0.15); }
        .nav-btn { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .date-center { cursor: pointer; text-align: center; transition: transform 0.2s; }
        .date-center:active { transform: scale(0.95); }
        input[type="date"] { display: none; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6 pb-32">

    <div id="stats-store"
         data-hd="{{ stats.h_done }}" data-ht="{{ stats.h_total }}"
         data-td="{{ stats.t_done }}" data-tt="{{ stats.t_total }}"
         data-current="{{ current_date_iso }}" style="display:none"></div>

    <div class="max-w-lg mx-auto">
        
        <header class="mt-16 mb-12 flex items-center justify-between">
            <button onclick="changeDay(-1)" class="nav-btn active:scale-90 transition-transform">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>

            <div class="date-center" onclick="document.getElementById('datePicker').showPicker()">
                <h1 class="text-9xl font-extrabold tracking-tighter leading-none">{{ dia_num }}</h1>
                <p class="text-orange-500 text-xl uppercase font-black tracking-[0.2em] mt-2">{{ mes_txt }}</p>
                <input type="date" id="datePicker" onchange="goToDate(this.value)" value="{{ current_date_iso }}">
            </div>

            <button onclick="changeDay(1)" class="nav-btn active:scale-90 transition-transform">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-10">
            <div class="card-glass p-6" onclick="abrirHistorial('habits')">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[9px] font-black text-zinc-500">RUTINAS</span>
                    <span id="h-pct" class="text-xs font-bold text-orange-500">0%</span>
                </div>
                <div class="h-1 bg-zinc-900 rounded-full overflow-hidden">
                    <div id="h-bar" class="h-full bg-orange-500 transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
            <div class="card-glass p-6" onclick="abrirHistorial('tasks')">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[9px] font-black text-zinc-500">TAREAS</span>
                    <span id="t-pct" class="text-xs font-bold text-blue-500">0%</span>
                </div>
                <div class="h-1 bg-zinc-900 rounded-full overflow-hidden">
                    <div id="t-bar" class="h-full bg-blue-500 transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="main-content">
            <div class="space-y-12">
                <section>
                    <h3 class="text-[10px] font-black text-zinc-800 uppercase tracking-widest mb-4 ml-4">Hábitos</h3>
                    {% for h in habits %}
                    <div class="card-glass p-6 mb-3 flex justify-between items-center">
                        <span class="font-bold text-zinc-200 text-lg">{% if h.due_at %}<span class="text-sm text-orange-400/70">{{ h.due_at.strftime('%H:%M') }}</span> {% endif %}{{ h.title }}</span>
                        <button onclick="completar('{{h.id}}')" class="w-8 h-8 rounded-full border-2 border-orange-500/30 flex items-center justify-center">
                            <div class="w-2.5 h-2.5 bg-orange-500 rounded-full"></div>
                        </button>
                    </div>
                    {% endfor %}
                </section>

                <section>
                    <h3 class="text-[10px] font-black text-zinc-800 uppercase tracking-widest mb-4 ml-4">Inbox</h3>
                    {% for t in tasks %}
                    <div class="card-glass p-6 mb-3 flex items-center">
                        <input type="checkbox" onchange="completar('{{t.id}}')" class="w-6 h-6 rounded-lg border-2 border-zinc-800 bg-transparent appearance-none checked:bg-blue-600 mr-5 transition-colors">
                        <span class="font-bold text-zinc-500 text-lg">{% if t.due_at %}<span class="text-sm text-blue-400/70">{{ t.due_at.strftime('%H:%M') }}</span> {% endif %}{{ t.title }}</span>
                    </div>
                    {% endfor %}
                </section>
            </div>
        </div>
    </div>

    <div id="modal-historial" class="modal" onclick="cerrarModal()">
        <div class="card-glass w-full max-w-xs p-8" onclick="event.stopPropagation()">
            <h4 id="modal-titulo" class="text-2xl font-black mb-6 uppercase tracking-tighter"></h4>
            <div id="modal-lista" class="space-y-3"></div>
            <button onclick="cerrarModal()" class="w-full mt-8 py-4 bg-zinc-900 rounded-2xl font-black text-[10px] tracking-widest">CERRAR</button>
        </div>
    </div>

    <script>
        function updateUI() {
            const store = document.getElementById('stats-store');
            if (!store) return;
            
            const d = store.dataset;
            // Parseo explícito a enteros para evitar errores matemáticos
            const hDone = parseInt(d.hd) || 0;
            const hTotal = parseInt(d.ht) || 0;
            const tDone = parseInt(d.td) || 0;
            const tTotal = parseInt(d.tt) || 0;

            const hPct = hTotal > 0 ? Math.round((hDone/hTotal)*100) : 0;
            const tPct = tTotal > 0 ? Math.round((tDone/tTotal)*100) : 0;

            const hBar = document.getElementById('h-bar');
            const tBar = document.getElementById('t-bar');
            
            if(hBar) hBar.style.width = hPct + '%';
            if(tBar) tBar.style.width = tPct + '%';
            
            document.getElementById('h-pct').innerText = hPct + '%';
            document.getElementById('t-pct').innerText = tPct + '%';
        }

        function changeDay(offset) {
            const currentStr = document.getElementById('stats-store').dataset.current;
            let date = new Date(currentStr + "T12:00:00");
            date.setDate(date.getDate() + offset);
            goToDate(date.toISOString().split('T')[0]);
        }

        function goToDate(isoDate) {
            window.location.href = '/dashboard?date_param=' + isoDate;
        }

        async function completar(id) {
            await fetch('/complete/' + id, { method: 'POST' });
            refreshData();
        }

        async function refreshData() {
            try {
                const response = await fetch(window.location.href);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const newMain = doc.getElementById('main-content').innerHTML;
                const oldMain = document.getElementById('main-content').innerHTML;

                if (newMain !== oldMain) {
                    document.getElementById('main-content').innerHTML = newMain;
                    
                    // Actualizar datos de stats
                    const newStats = doc.getElementById('stats-store').dataset;
                    const oldStats = document.getElementById('stats-store').dataset;
                    
                    oldStats.hd = newStats.hd; oldStats.ht = newStats.ht;
                    oldStats.td = newStats.td; oldStats.tt = newStats.tt;
                    
                    updateUI();
                }
            } catch (e) { console.error(e); }
        }
        
        async function abrirHistorial(tipo) {
            document.getElementById('modal-titulo').innerText = tipo === 'habits' ? 'Completados' : 'Tareas Hechas';
            document.getElementById('modal-historial').style.display = 'flex';
            const res = await fetch('/api/history/' + tipo);
            const data = await res.json();
            document.getElementById('modal-lista').innerHTML = data.map(i => `
                <div class="flex justify-between p-4 bg-white/5 rounded-2xl">
                    <span class="text-sm font-bold">${i.title}</span>
                    <span class="text-[10px] text-zinc-600">${i.time}</span>
                </div>
            `).join('') || '<p class="text-center text-zinc-500">Vacío</p>';
        }

        function cerrarModal() { document.getElementById('modal-historial').style.display = 'none'; }

        setInterval(refreshData, 2000);
        window.onload = updateUI;
    </script>
</body>
</html>
